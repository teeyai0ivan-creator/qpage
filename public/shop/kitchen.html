<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="/css/settings.css">
  <link rel="stylesheet" href="/css/shop.css">

</head>
<body>
  <nav class="site-nav">
    <a class="brand" href="/shop">
      <div class="brand-logo"><img src="/img/logo.svg" alt="QPage"></div>
      <span class="brand-name" id="shopName">ร้านของฉัน</span>
    </a>
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="เปิด/ปิดเมนู" aria-expanded="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <button class="theme-toggle" type="button" aria-label="สลับธีม" style="position:static;">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" style="display:none"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </nav>

      <!-- เมนูด้านซ้าย (แบบเดียวกับหน้า /settings) -->
    <div class="shop-shell">
      <aside class="settings-menu shop-side">
        <div class="menu-title">ร้านค้า</div>
        <a class="menu-item" href="/shop/orders.html" data-path="/shop/orders.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" stroke-linecap="round"/></svg>
          สั่งอาหาร
        </a>
        <a class="menu-item" href="/shop/kitchen.html" data-path="/shop/kitchen.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10h16v6a4 4 0 01-4 4H8a4 4 0 01-4-4v-6z"/><path d="M6 10V7a2 2 0 012-2h8a2 2 0 012 2v3"/></svg>
          ครัว
        </a>
        <a class="menu-item" href="/shop/cashier.html" data-path="/shop/cashier.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 11h.01M12 11h.01M15 11h.01M9 15h.01M12 15h.01M15 15h.01"/></svg>
          แคชเชียร์
        </a>
        <a class="menu-item" href="/shop/history.html" data-path="/shop/history.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1015.5-6.2M3 4v4h4" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 8v4l3 2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          ประวัติ
        </a>
        <a class="menu-item" href="/shop/menu.html" data-path="/shop/menu.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5a2 2 0 012-2h12v18H6a2 2 0 01-2-2V5z" stroke-linejoin="round"/><path d="M8 7h8M8 11h5" stroke-linecap="round"/></svg>
          จัดการเมนู
        </a>
        <a class="menu-item" href="/shop/menus.html" data-path="/shop/menus.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10M15 10v10"/></svg>
          เมนูทั้งหมด
        </a>
        <a class="menu-item" href="/shop/setup.html" data-path="/shop/setup.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4H6z" stroke-linejoin="round"/><path d="M3 6h18M16 10a4 4 0 01-8 0" stroke-linecap="round"/></svg>
          ตั้งค่าข้อมูลร้าน
        </a>
        <a class="menu-item" href="/shop/notify.html" data-path="/shop/notify.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke-linejoin="round"/><path d="M13.7 21a2 2 0 01-3.4 0" stroke-linecap="round"/></svg>
          แจ้งเตือน
        </a>
        <a class="menu-item" href="#" data-path="#" id="viewShopLink" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/></svg>
          ดูร้าน
        </a>
        <div class="menu-divider"></div>
        <a class="menu-item" href="/settings/profile" data-path="/settings/profile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" stroke-linecap="round" stroke-linejoin="round"/></svg>
          ออกจากร้านค้า
        </a>
      </aside>
      <script>
        // เปิด/ปิดเมนูด้านซ้าย (มือถือ) + ไฮไลต์เมนูของหน้าที่เปิดอยู่
        (function () {
          var KEY = 'qpage_shop_menu';
          var btn = document.getElementById('menuToggle');
          function applyMenu(open) {
            document.body.classList.toggle('side-menu-closed', !open);
            if (btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
          }
          function saveMenu(open) { try { localStorage.setItem(KEY, open ? 'open' : 'closed'); } catch (e) { /* ข้าม */ } }
          var saved = null;
          try { saved = localStorage.getItem(KEY); } catch (e) { /* ข้าม */ }
          // ค่าเริ่มต้น: จอใหญ่เปิดเมนู จอมือถือซ่อนไว้ก่อน (จำค่าที่ผู้ใช้เลือกไว้ในเครื่อง)
          applyMenu(saved ? saved === 'open' : window.innerWidth > 900);
          if (btn) btn.addEventListener('click', function () { var open = document.body.classList.contains('side-menu-closed'); applyMenu(open); saveMenu(open); });
          // ความสูงจริงของแถบหัว → ใช้เป็นจุดเริ่มของแผงเมนูด้านซ้าย
          function syncNavHeight() {
            var nav = document.querySelector('.site-nav');
            if (nav) document.documentElement.style.setProperty('--nav-h', Math.round(nav.getBoundingClientRect().height) + 'px');
          }
          syncNavHeight();
          window.addEventListener('resize', syncNavHeight);
          // ฉากมืดหลังเมนู — แตะแล้วปิดเมนู
          var back = document.createElement('div');
          back.className = 'side-menu-backdrop';
          document.body.appendChild(back);
          back.addEventListener('click', function () { applyMenu(false); saveMenu(false); });
          // ปิดเมนูด้วยปุ่ม Esc
          document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { applyMenu(false); saveMenu(false); } });
          var here = location.pathname.replace(/\/+$/, '');
          document.querySelectorAll('.shop-side .menu-item[data-path]').forEach(function (a) {
            if (a.dataset.path === here) a.classList.add('active');
          });
          // ลิงก์ "ดูร้าน" — ดึงรหัสร้านของตัวเอง
          fetch('/api/shop/me').then(function (r) { return r.json(); }).then(function (d) {
            if (d && d.shop && d.shop.public_code) document.getElementById('viewShopLink').href = '/s/' + d.shop.public_code;
          }).catch(function () { /* ข้าม */ });
        })();
      </script>

      <div class="shop-wrap">
    <div class="shop-head">
      <h1 id="pageTitle">ครัว</h1>
      <p id="pageDesc">รายการอาหารจากบิลที่เปิดอยู่ — กด "เริ่มทำ" เมื่อเริ่ม และ "เคลียร์อาหาร" เมื่อเสร็จ (อัปเดตอัตโนมัติทุก 10 วินาที)</p>
      <div class="shop-actions">
        <button class="mini-btn" id="refreshBtn" type="button">รีเฟรช</button>
        <span id="lastUpdate" style="font-size:12.5px;color:var(--muted);align-self:center;"></span>
      </div>
    </div>

    <div class="kitchen-tabs">
      <button class="mini-btn primary" data-filter="all" type="button"><span class="f-label">ทั้งหมด</span></button>
      <button class="mini-btn" data-filter="pending" type="button"><span class="f-label">รอทำ</span><span class="f-badge" id="fPendingBadge" style="display:none;">0</span></button>
      <button class="mini-btn" data-filter="cooking" type="button"><span class="f-label">กำลังทำ</span></button>
      <button class="mini-btn" data-filter="done" type="button"><span class="f-label">เสร็จแล้ว</span></button>
    </div>

    <div class="kitchen-tabs">
      <span style="align-self:center;font-size:12.5px;color:var(--muted);">จัดกลุ่ม:</span>

  <!-- Modal ยกเลิกรายการ (เลือกสาเหตุ) -->
  <div class="modal-overlay" id="cancelModal">
    <div class="modal">
      <h3>ยกเลิกรายการ</h3>
      <p class="sub" id="cancelSub">—</p>
      <div class="field">
        <label style="display:flex;gap:8px;align-items:center;font-size:14px;"><input type="radio" name="creason" value="วัตถุดิบหมด" checked> วัตถุดิบหมด</label>
        <label style="display:flex;gap:8px;align-items:center;font-size:14px;margin-top:8px;"><input type="radio" name="creason" value="other"> อื่น ๆ (ระบุ)</label>
      </div>
      <div class="field" id="cancelOtherWrap" style="display:none;">
        <input class="mini-input" id="cancelOtherText" maxlength="200" placeholder="พิมพ์สาเหตุ..." style="width:100%;">
      </div>
      <div class="error-msg" id="cancelErr"></div>
      <div class="modal-actions">
        <button class="mini-btn" id="cancelClose" type="button">ปิด</button>
        <button class="mini-btn danger" id="cancelConfirm" type="button">ยืนยันยกเลิก</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // ---------- จุดแสดงผลของหน้านี้: ครัว (/shop/kitchen.html) หรือแคชเชียร์ (/shop/cashier.html) ----------
    // หมวดหมู่แต่ละหมวดถูกตั้ง "เส้นทาง" ได้ว่าจะส่งรายการไปครัวหรือแคชเชียร์ (ตั้งที่หน้าจัดการเมนู)
    const STATION = /cashier/i.test(location.pathname) ? 'cashier' : 'kitchen';
    const IS_CASHIER = STATION === 'cashier';
    const L = IS_CASHIER
      ? {
        title: 'แคชเชียร์', switchLabel: 'ครัว', switchHref: '/shop/kitchen.html',
        desc: 'รายการจากหมวดหมู่ที่ตั้งเส้นทางไว้ที่แคชเชียร์ — กด "เริ่มจัด" เมื่อเริ่ม และ "จัดเสร็จ" เมื่อเสร็จ (อัปเดตอัตโนมัติทุก 10 วินาที)',
        stPending: 'ยังไม่จัด', stCooking: 'กำลังจัด', stDone: 'จัดเสร็จ', actStart: 'เริ่มจัด', actDone: 'จัดเสร็จ',
        outOfStock: 'ของหมด',
      }
      : {
        title: 'ครัว', switchLabel: 'แคชเชียร์', switchHref: '/shop/cashier.html',
        desc: 'รายการอาหารจากบิลที่เปิดอยู่ — กด "เริ่มทำ" เมื่อเริ่ม และ "เคลียร์อาหาร" เมื่อเสร็จ (อัปเดตอัตโนมัติทุก 10 วินาที)',
        stPending: 'รอทำ', stCooking: 'กำลังทำ', stDone: 'เสร็จแล้ว', actStart: 'เริ่มทำ', actDone: 'เคลียร์อาหาร',
        outOfStock: 'วัตถุดิบหมด',
      };

    const STATUS_LABEL = { pending: L.stPending, cooking: L.stCooking, done: L.stDone };
    const STATUS_CLASS = { pending: 'st-pending', cooking: 'st-cooking', done: 'st-done' };
    let filter = 'all';
    let groupBy = 'bill';   // 'bill' = ตามโต๊ะ/บิล, 'menu' = รวมเมนูเดียวกันจากทุกโต๊ะ
    let items = [];
    let toastTimer = null;

    async function api(path, opts) {
      const res = await fetch(path, opts);
      let data; try { data = await res.json(); } catch { const e = new Error('HTTP ' + res.status); e.status = res.status; throw e; }
      if (!data.ok) { const e = new Error(data.message || 'เกิดข้อผิดพลาด'); e.status = res.status; throw e; }
      return data;
    }
    function toast(msg) {
      const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
      clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
    }
    const hhmm = (iso) => { const d = new Date(iso); const p = (n) => String(n).padStart(2, '0'); return isNaN(d) ? '' : p(d.getHours()) + ':' + p(d.getMinutes()); };

    const billNoFmt = (n) => (n ? '#' + String(n).padStart(4, '0') : '—');

    function itemHtml(i, showCtx) {
      let opts = []; try { opts = i.options_json ? JSON.parse(i.options_json) : []; } catch (e) {}
      const btn = i.status === 'pending'
        ? '<button class="mini-btn primary" data-set="' + i.id + '" data-status="cooking" type="button">' + L.actStart + '</button>'
        : i.status === 'cooking'
          ? '<button class="mini-btn primary" data-set="' + i.id + '" data-status="done" type="button">' + L.actDone + '</button>'
          : '<span class="mini-btn" style="opacity:.6;cursor:default;">' + L.stDone + '</span>';
      const cancelBtn = i.status !== 'done'
        ? '<button class="mini-btn danger" data-cancel="' + i.id + '" data-name="' + esc(i.menu_name) + '" type="button">ยกเลิก</button>'
        : '';
      const img = i.image_url
        ? '<img class="k-img" src="' + esc(i.image_url) + '" alt="">'
        : '<div class="k-img k-img-empty"></div>';
      return `<div class="k-item ${i.status === 'done' ? 'k-done' : ''}">
        ${img}
        <div class="k-qty">${i.quantity}×</div>
        <div class="k-info">
          <div class="k-name">${esc(i.menu_name)}</div>
          ${opts.length ? '<div class="k-opts">' + esc(opts.join(', ')) + '</div>' : ''}
          ${showCtx ? '<div class="k-ctx">โต๊ะ ' + esc(i.table_code) + ' · บิล ' + billNoFmt(i.bill_no) + '</div>' : ''}
          <div class="k-time">สั่งเมื่อ ${hhmm(i.created_at)} · ⏱ <span class="k-timer" data-created="${esc(i.created_at)}" data-status="${esc(i.status)}" data-done="${esc(i.done_at || '')}">—</span></div>
        </div>
        <span class="st-badge ${STATUS_CLASS[i.status]}">${STATUS_LABEL[i.status]}</span>
        <div class="k-actions" style="display:flex;gap:6px;flex-wrap:wrap;">${btn}${cancelBtn}</div>
      </div>`;
    }

    function render() {
      // ป้ายตัวเลขแจ้งเตือนบนปุ่ม "รอทำ/ยังไม่จัด" — นับทุกรายการที่ยังไม่เริ่มทำของจุดนี้
      const pendingCount = items.filter((i) => i.status === 'pending').length;
      const badge = document.getElementById('fPendingBadge');
      if (badge) {
        badge.textContent = pendingCount > 99 ? '99+' : String(pendingCount);
        badge.style.display = pendingCount ? '' : 'none';
      }

      const list = filter === 'all' ? items : items.filter((i) => i.status === filter);
      const box = document.getElementById('kitchenList');
      if (!list.length) { box.innerHTML = '<div class="cat-empty">ไม่มีรายการ' + (filter === 'all' ? '' : 'ในสถานะนี้') + '</div>'; return; }

      let groups;
      if (groupBy === 'menu') {
        // รวมเมนูเดียวกันจากทุกโต๊ะไว้การ์ดเดียว
        const map = {};
        list.forEach((i) => {
          const key = i.menu_id != null ? 'm' + i.menu_id : 'n' + i.menu_name;
          if (!map[key]) map[key] = { title: i.menu_name, items: [] };
          map[key].items.push(i);
        });
        groups = Object.values(map).map((g) => ({
          title: g.title,
          sub: 'รวม ' + g.items.reduce((s, i) => s + i.quantity, 0) + ' จาน',
          items: g.items,
          ctx: true,
        }));
      } else {
        const map = {};
        const order = [];
        list.forEach((i) => {
          if (!map[i.order_id]) { map[i.order_id] = { title: 'โต๊ะ ' + i.table_code, sub: 'บิล ' + billNoFmt(i.bill_no), items: [] }; order.push(map[i.order_id]); }
          map[i.order_id].items.push(i);
        });
        groups = order.map((g) => ({ title: g.title, sub: g.sub, items: g.items, ctx: false }));
      }

      box.innerHTML = groups.map((g) => `
        <div class="k-bill">
          <div class="k-bill-head">${esc(g.title)}${g.sub ? ' <span style="font-weight:600;color:var(--muted);font-size:13px;">· ' + esc(g.sub) + '</span>' : ''}</div>
          ${g.items.map((i) => itemHtml(i, g.ctx)).join('')}
        </div>`).join('');

      box.querySelectorAll('[data-set]').forEach((b) => b.addEventListener('click', async () => {
        b.disabled = true;
        try {
          const r = await api('/api/shop/order-items/' + b.dataset.set + '/status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: b.dataset.status }) });
          toast(r.message || 'อัปเดตแล้ว');
          await load();
        } catch (e) { alert(e.message); b.disabled = false; }
      }));
      box.querySelectorAll('[data-cancel]').forEach((b) => b.addEventListener('click', () => openCancel(Number(b.dataset.cancel), b.dataset.name)));
      tickTimers();
    }

    // ---------- นาฬิกาจับเวลาต่อรายการ (นับจากเวลาที่ลูกค้าสั่ง) ----------
    function fmtDur(ms) {
      const s = Math.max(0, Math.floor(ms / 1000));
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
      const p = (n) => String(n).padStart(2, '0');
      return h > 0 ? h + ':' + p(m) + ':' + p(sec) : p(m) + ':' + p(sec);
    }
    function tickTimers() {
      const now = Date.now();
      document.querySelectorAll('.k-timer').forEach((el) => {
        const created = new Date(el.dataset.created).getTime();
        if (isNaN(created)) { el.textContent = '—'; return; }
        const done = el.dataset.done ? new Date(el.dataset.done).getTime() : NaN;
        const end = (el.dataset.status === 'done' && !isNaN(done)) ? done : now;
        const ms = end - created;
        el.textContent = fmtDur(ms);
        el.classList.remove('t-ok', 't-warn', 't-danger', 't-done');
        if (el.dataset.status === 'done') { el.classList.add('t-done'); return; }
        const min = ms / 60000;
        el.classList.add(min >= 15 ? 't-danger' : min >= 5 ? 't-warn' : 't-ok');
      });
    }
    setInterval(tickTimers, 1000);

    // ปรับข้อความทั้งหน้าให้ตรงกับจุดที่เปิด (ครัว หรือ แคชเชียร์)
    function applyStationLabels() {
      document.title = L.title + ' | ระบบสมาชิก';
      // ไม่แตะชื่อร้านมุมซ้ายบน — ให้แสดงชื่อร้านเหมือนหน้าอื่น (ชื่อจุดแสดงผลอยู่ที่หัวข้อหน้า #pageTitle)
      const t = document.getElementById('pageTitle');
      if (t) t.textContent = L.title;
      const d = document.getElementById('pageDesc');
      if (d) d.textContent = L.desc;
      const sw = document.getElementById('stationSwitch');
      if (sw) { sw.textContent = L.switchLabel; sw.href = L.switchHref; }
      const setLabel = (filter, text) => {
        const el = document.querySelector('[data-filter="' + filter + '"] .f-label');
        if (el) el.textContent = text;
      };
      setLabel('pending', L.stPending);
      setLabel('cooking', L.stCooking);
      setLabel('done', L.stDone);
      // สาเหตุยกเลิก: ครัวใช้ "วัตถุดิบหมด" / แคชเชียร์ใช้ "ของหมด"
      const r0 = document.querySelector('input[name="creason"]');
      if (r0) {
        r0.value = L.outOfStock;
        const label = r0.closest('label');
        if (label) label.childNodes[label.childNodes.length - 1].textContent = ' ' + L.outOfStock;
      }
    }
    applyStationLabels();

    async function load() {
      const data = await api('/api/shop/kitchen?station=' + STATION);
      items = data.items || [];
      document.getElementById('lastUpdate').textContent = 'อัปเดตล่าสุด ' + new Date().toLocaleTimeString('th-TH');
      render();
    }

    document.querySelectorAll('[data-filter]').forEach((b) => b.addEventListener('click', () => {
      filter = b.dataset.filter;
      document.querySelectorAll('[data-filter]').forEach((x) => x.classList.toggle('primary', x === b));
      render();
    }));
    document.querySelectorAll('[data-group]').forEach((b) => b.addEventListener('click', () => {
      groupBy = b.dataset.group;
      document.querySelectorAll('[data-group]').forEach((x) => x.classList.toggle('primary', x === b));
      render();
    }));
    document.getElementById('refreshBtn').addEventListener('click', () => load().catch((e) => alert(e.message)));

    // ---------- ยกเลิกรายการ (ครัว) + เลือกสาเหตุ ----------
    const cancelModal = document.getElementById('cancelModal');
    let cancelId = null;
    function openCancel(id, name) {
      cancelId = id;
      document.getElementById('cancelSub').textContent = name || '';
      document.querySelector('input[name="creason"][value="วัตถุดิบหมด"]').checked = true;
      document.getElementById('cancelOtherWrap').style.display = 'none';
      document.getElementById('cancelOtherText').value = '';
      document.getElementById('cancelErr').style.display = 'none';
      cancelModal.classList.add('show');
    }
    function closeCancel() { cancelModal.classList.remove('show'); cancelId = null; }
    document.getElementById('cancelClose').addEventListener('click', closeCancel);
    cancelModal.addEventListener('click', (e) => { if (e.target === cancelModal) closeCancel(); });
    document.querySelectorAll('input[name="creason"]').forEach((r) => r.addEventListener('change', () => {
      const other = document.querySelector('input[name="creason"]:checked').value === 'other';
      document.getElementById('cancelOtherWrap').style.display = other ? '' : 'none';
      if (other) document.getElementById('cancelOtherText').focus();
    }));
    document.getElementById('cancelConfirm').addEventListener('click', async (e) => {
      const sel = document.querySelector('input[name="creason"]:checked');
      const other = sel && sel.value === 'other';
      const text = document.getElementById('cancelOtherText').value.trim();
      const errEl = document.getElementById('cancelErr');
      errEl.style.display = 'none';
      if (other && !text) { errEl.textContent = 'กรุณาพิมพ์สาเหตุ'; errEl.style.display = 'block'; return; }
      const reason = other ? ('อื่น ๆ: ' + text) : 'วัตถุดิบหมด';
      const btn = e.target; btn.disabled = true;
      try {
        const r = await api('/api/shop/order-items/' + cancelId + '/status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: 'cancelled', reason }) });
        toast(r.message || 'ยกเลิกแล้ว');
        closeCancel();
        await load();
      } catch (err) { alert(err.message); }
      finally { btn.disabled = false; }
    });

    load().catch((e) => {
      if (e.status === 403) window.location.href = '/shop';
      else document.getElementById('kitchenList').innerHTML = '<div class="cat-empty">' + esc(e.message) + '</div>';
    });
    setInterval(() => { load().catch(() => {}); }, 10000);
  </script>
</body>
</html>
