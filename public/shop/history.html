  <style>
    .hist-filter { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
    .hist-filter label { font-size: 13px; color: var(--muted); font-weight: 600; }
    details.bill-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; }
    details.bill-card > summary { list-style: none; cursor: pointer; padding: 14px; display: flex; align-items: center; gap: 12px; }
    details.bill-card > summary::-webkit-details-marker { display: none; }
    details.bill-card > summary::after { content: '▾'; margin-left: auto; color: var(--muted); transition: transform .15s ease; }
    details.bill-card[open] > summary::after { transform: rotate(180deg); }
    .hist-sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
    .hist-items { padding: 0 14px 14px; border-top: 1px solid var(--border); margin-top: 2px; padding-top: 12px; }
    .hist-actions { padding: 0 14px 14px; display: flex; gap: 8px; flex-wrap: wrap; }
    /* แท็บ: ประวัติบิล / QR โต๊ะที่ปิดใช้งานแล้ว */
    .hist-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .hist-tab { font-family: inherit; font-size: 13.5px; font-weight: 700; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
    .hist-tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .qr-card { display: flex; gap: 14px; align-items: flex-start; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; flex-wrap: wrap; }
    .qr-card img { width: 104px; height: 104px; background: #fff; border-radius: 8px; border: 1px solid var(--border); }
    .qr-off { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: rgba(180,83,9,.14); color: var(--warning); vertical-align: middle; }
  </style>
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg">
</head>
<body>

      <script>
        // เปิด/ปิดเมนูด้านซ้าย (มือถือ) + ไฮไลต์เมนูของหน้าที่เปิดอยู่
        (function () {
          var KEY = 'qpage_shop_menu';
          var btn = document.getElementById('menuToggle');
          function applyMenu(open) {
            document.body.classList.toggle('side-menu-closed', !open);
            if (btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
          }
          function saveMenu(open) { try { localStorage.setItem(KEY, open ? 'open' : 'closed'); } catch (e) { /* ข้าม */ } }
          var saved = null;
          try { saved = localStorage.getItem(KEY); } catch (e) { /* ข้าม */ }
          // ค่าเริ่มต้น: จอใหญ่เปิดเมนู จอมือถือซ่อนไว้ก่อน (จำค่าที่ผู้ใช้เลือกไว้ในเครื่อง)
          applyMenu(saved ? saved === 'open' : window.innerWidth > 900);
          if (btn) btn.addEventListener('click', function () { var open = document.body.classList.contains('side-menu-closed'); applyMenu(open); saveMenu(open); });
          // ความสูงจริงของแถบหัว → ใช้เป็นจุดเริ่มของแผงเมนูด้านซ้าย
          function syncNavHeight() {
            var nav = document.querySelector('.site-nav');
            if (nav) document.documentElement.style.setProperty('--nav-h', Math.round(nav.getBoundingClientRect().height) + 'px');
          }
          syncNavHeight();
          window.addEventListener('resize', syncNavHeight);
          // ฉากมืดหลังเมนู — แตะแล้วปิดเมนู
          var back = document.createElement('div');
          back.className = 'side-menu-backdrop';
          document.body.appendChild(back);
          back.addEventListener('click', function () { applyMenu(false); saveMenu(false); });
          // ปิดเมนูด้วยปุ่ม Esc
          document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { applyMenu(false); saveMenu(false); } });
          var here = location.pathname.replace(/\/+$/, '');
          document.querySelectorAll('.shop-side .menu-item[data-path]').forEach(function (a) {
            if (a.dataset.path === here) a.classList.add('active');
          });
          // ลิงก์ "ดูร้าน" — ดึงรหัสร้านของตัวเอง
          fetch('/api/shop/me').then(function (r) { return r.json(); }).then(function (d) {
            if (d && d.shop && d.shop.public_code) document.getElementById('viewShopLink').href = '/s/' + d.shop.public_code;
          }).catch(function () { /* ข้าม */ });
        })();
      </script>

  <div class="toast" id="toast"></div>

  <script>
    let toastTimer = null;
    let lastOrders = [];

    async function api(path, opts) {
      const res = await fetch(path, opts);
      let data; try { data = await res.json(); } catch { const e = new Error('HTTP ' + res.status); e.status = res.status; throw e; }
      if (!data.ok) { const e = new Error(data.message || 'เกิดข้อผิดพลาด'); e.status = res.status; throw e; }
      return data;
    }
    function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2500); }

    let retired = [];

    async function loadTables() {
      try {
        const [act, ret] = await Promise.all([api('/api/shop/tables'), api('/api/shop/tables/retired')]);
        retired = ret.tables || [];
        const sel = document.getElementById('fTable');
        const cur = sel.value;
        const opts = (act.tables || []).map((t) => `<option value="${t.id}">โต๊ะ ${esc(t.code)}</option>`)
          .concat(retired.map((t) => `<option value="${t.id}">โต๊ะ ${esc(t.code)} (ปิดใช้งาน)</option>`));
        sel.innerHTML = '<option value="">ทุกโต๊ะ</option>' + opts.join('');
        if (cur) sel.value = cur;
        document.getElementById('cntQr').textContent = retired.length ? '(' + retired.length + ')' : '';
        renderRetired();
      } catch (e) { /* ignore */ }
    }

    // ---------- ประวัติ QR โต๊ะที่ปิดใช้งานแล้ว (หลักฐาน) ----------
    function renderRetired() {
      const box = document.getElementById('qrList');
      if (!retired.length) {
        box.innerHTML = '<div class="cat-empty">ยังไม่มี QR ที่ปิดใช้งาน — ถ้าเปิดสวิตช์ "ปิดใช้งาน QR ของโต๊ะทันทีเมื่อเช็คบิล" ไว้ โต๊ะที่เช็คบิลแล้วจะมาแสดงที่นี่</div>';
        return;
      }
      box.innerHTML = retired.map((t) => `
        <div class="qr-card" data-id="${t.id}">
          <img src="/api/shop/tables/${t.id}/qr?origin=${encodeURIComponent(location.origin)}" alt="QR โต๊ะ ${esc(t.code)}">
          <div style="flex:1;min-width:0;">
            <div class="table-code">โต๊ะ ${esc(t.code)} <span class="qr-off">ปิดใช้งานแล้ว</span></div>
            <div class="hist-sub">${t.zone_name ? 'โซน ' + esc(t.zone_name) + ' · ' : ''}สร้าง QR ${dt(t.created_at)} · ปิดใช้งาน ${dt(t.retired_at)}</div>
            <div class="hist-sub">บิลที่ปิดแล้ว ${t.bill_count} ใบ · ยอดรวม ${money(t.total_sales)}</div>
            <div class="hist-actions" style="padding:10px 0 0;">
              <a class="mini-btn" href="/api/shop/tables/${t.id}/qr?origin=${encodeURIComponent(location.origin)}" download="table-${esc(t.code)}-qr.png">ดาวน์โหลด QR</a>
              <button class="mini-btn" data-bills="${t.id}" type="button">ดูบิลของโต๊ะนี้</button>
            </div>
          </div>
        </div>`).join('');
      box.querySelectorAll('[data-bills]').forEach((b) => b.addEventListener('click', () => {
        showTab('bills');
        const sel = document.getElementById('fTable');
        sel.value = b.dataset.bills;
        loadHistory().catch((e) => alert(e.message));
      }));
    }

    function showTab(which) {
      const isQr = which === 'qr';
      document.getElementById('tabBills').classList.toggle('active', !isQr);
      document.getElementById('tabQr').classList.toggle('active', isQr);
      document.getElementById('paneBills').hidden = isQr;
      document.getElementById('paneQr').hidden = !isQr;
    }
    document.getElementById('tabBills').addEventListener('click', () => showTab('bills'));
    document.getElementById('tabQr').addEventListener('click', () => showTab('qr'));

    async function loadHistory() {
      const tableId = document.getElementById('fTable').value;
      const limit = document.getElementById('fLimit').value;
      const qs = new URLSearchParams();
      if (tableId) qs.set('tableId', tableId);
      if (limit) qs.set('limit', limit);
      const data = await api('/api/shop/orders/history' + (qs.toString() ? '?' + qs.toString() : ''));
      lastOrders = data.orders || [];
      document.getElementById('cntBills').textContent = lastOrders.length ? '(' + lastOrders.length + ')' : '';
      const box = document.getElementById('histList');
      if (!lastOrders.length) { box.innerHTML = '<div class="cat-empty">ยังไม่มีประวัติ (ยังไม่มีการเช็คบิล)</div>'; return; }
      box.innerHTML = lastOrders.map((o) => `
        <details class="bill-card">
          <summary>
            <div style="flex:1;min-width:0;">
              <div class="table-code">บิล ${billNoFmt(o.bill_no)} · โต๊ะ ${esc(o.table_code)}</div>
              <div class="hist-sub">เปิด ${dt(o.opened_at)} · ปิด ${dt(o.closed_at)} · ${o.item_count} รายการ</div>
            </div>
            <div class="bill-total">${money(o.total)}</div>
          </summary>
          <div class="hist-items">
            ${o.items.length ? o.items.map((it) => {
              let opts = []; try { opts = it.options_json ? JSON.parse(it.options_json) : []; } catch (e) {}
              const cancelled = it.status === 'cancelled';
              return `<div class="bill-item"${cancelled ? ' style="opacity:.6;"' : ''}>
                <span>${it.quantity} × ${cancelled ? '<span style="text-decoration:line-through;">' + esc(it.menu_name) + '</span>' : esc(it.menu_name)}${opts.length ? ' <small>(' + esc(opts.join(', ')) + ')</small>' : ''}${cancelled ? ' <span class="st-badge st-cancelled">ยกเลิก' + (it.cancel_reason ? ': ' + esc(it.cancel_reason) : '') + '</span>' : ''}</span>
                <span>${cancelled ? '—' : money(it.line_total)}</span>
              </div>`;
            }).join('') : '<div style="color:var(--muted);font-size:13px;">ไม่มีรายการ</div>'}
          </div>
          <div class="hist-actions">
            <a class="mini-btn primary" href="/shop/receipt.html?order=${o.id}" target="_blank" rel="noopener">🖨 ขอใบเสร็จ (พิมพ์ใหม่)</a>
          </div>
        </details>`).join('');
    }

    document.getElementById('fTable').addEventListener('change', () => loadHistory().catch((e) => alert(e.message)));
    document.getElementById('fLimit').addEventListener('change', () => loadHistory().catch((e) => alert(e.message)));

    document.getElementById('exportBtn').addEventListener('click', () => {
      if (!lastOrders.length) { toast('ไม่มีข้อมูลให้ออก'); return; }
      const rows = [['บิล', 'โต๊ะ', 'เปิด', 'ปิด', 'จำนวน', 'ยอดรวม', 'รายการ']];
      lastOrders.forEach((o) => {
        const names = o.items.map((it) => `${it.quantity}x ${it.menu_name}${(it.status === 'cancelled') ? '(ยกเลิก)' : ''}`).join(' | ');
        rows.push([billNoFmt(o.bill_no), o.table_code, o.opened_at || '', o.closed_at || '', o.item_count, Number(o.total), names]);
      });
      const csv = '\ufeff' + rows.map((r) => r.map((c) => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'order-history.csv';
      a.click();
      URL.revokeObjectURL(a.href);
    });

    document.getElementById('exportQrBtn').addEventListener('click', () => {
      if (!retired.length) { toast('ไม่มีข้อมูลให้ออก'); return; }
      const rows = [['โต๊ะ', 'โซน', 'สร้าง QR', 'ปิดใช้งานเมื่อ', 'บิลที่ปิดแล้ว', 'ยอดรวม']];
      retired.forEach((t) => rows.push([t.code, t.zone_name || '', t.created_at || '', t.retired_at || '', t.bill_count, Number(t.total_sales)]));
      const csv = '\ufeff' + rows.map((r) => r.map((c) => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'qr-history.csv';
      a.click();
      URL.revokeObjectURL(a.href);
    });

    (async () => {
      try {
        const me = await api('/api/shop/me');
        if (!me.shop) { window.location.href = '/shop/setup.html'; return; }
        document.getElementById('shopName').textContent = me.shop.name || 'ร้านของฉัน';
        await loadTables();
        await loadHistory();
      } catch (e) {
        if (e.status === 403) { window.location.href = '/shop'; return; }
        document.getElementById('histList').innerHTML = '<div class="cat-empty">' + esc(e.message) + '</div>';
      }
    })();
  </script>
</body>
</html>
