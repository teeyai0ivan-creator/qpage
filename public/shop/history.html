<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ประวัติออเดอร์ | ระบบสมาชิก</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/settings.css">
  <link rel="stylesheet" href="/css/shop.css">
  <script src="/js/theme.js"></script>
  <style>
    .hist-filter { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
    .hist-filter label { font-size: 13px; color: var(--muted); font-weight: 600; }
    details.bill-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; }
    details.bill-card > summary { list-style: none; cursor: pointer; padding: 14px; display: flex; align-items: center; gap: 12px; }
    details.bill-card > summary::-webkit-details-marker { display: none; }
    details.bill-card > summary::after { content: '▾'; margin-left: auto; color: var(--muted); transition: transform .15s ease; }
    details.bill-card[open] > summary::after { transform: rotate(180deg); }
    .hist-sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
    .hist-items { padding: 0 14px 14px; border-top: 1px solid var(--border); margin-top: 2px; padding-top: 12px; }
    .hist-actions { padding: 0 14px 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  </style>
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg">
</head>
<body>
  <nav class="site-nav">
    <a class="brand" href="/shop">
      <div class="brand-logo"><img src="/img/logo.svg" alt="QPage"></div>
      <span class="brand-name" id="shopName">ร้านของฉัน</span>
    </a>
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="เปิด/ปิดเมนู" aria-expanded="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <button class="theme-toggle" type="button" aria-label="สลับธีม" style="position:static;">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" style="display:none"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </nav>

      <!-- เมนูด้านซ้าย (แบบเดียวกับหน้า /settings) -->
    <div class="shop-shell">
      <aside class="settings-menu shop-side">
        <div class="menu-title">ร้านค้า</div>
        <a class="menu-item" href="/shop/orders.html" data-path="/shop/orders.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" stroke-linecap="round"/></svg>
          สั่งอาหาร
        </a>
        <a class="menu-item" href="/shop/kitchen.html" data-path="/shop/kitchen.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10h16v6a4 4 0 01-4 4H8a4 4 0 01-4-4v-6z"/><path d="M6 10V7a2 2 0 012-2h8a2 2 0 012 2v3"/></svg>
          ครัว
        </a>
        <a class="menu-item" href="/shop/cashier.html" data-path="/shop/cashier.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 11h.01M12 11h.01M15 11h.01M9 15h.01M12 15h.01M15 15h.01"/></svg>
          แคชเชียร์
        </a>
        <a class="menu-item" href="/shop/history.html" data-path="/shop/history.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1015.5-6.2M3 4v4h4" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 8v4l3 2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          ประวัติ
        </a>
        <a class="menu-item" href="/shop/menu.html" data-path="/shop/menu.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5a2 2 0 012-2h12v18H6a2 2 0 01-2-2V5z" stroke-linejoin="round"/><path d="M8 7h8M8 11h5" stroke-linecap="round"/></svg>
          จัดการเมนู
        </a>
        <a class="menu-item" href="/shop/menus.html" data-path="/shop/menus.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10M15 10v10"/></svg>
          เมนูทั้งหมด
        </a>
        <a class="menu-item" href="/shop/setup.html" data-path="/shop/setup.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4H6z" stroke-linejoin="round"/><path d="M3 6h18M16 10a4 4 0 01-8 0" stroke-linecap="round"/></svg>
          ตั้งค่าข้อมูลร้าน
        </a>
        <a class="menu-item" href="/shop/notify.html" data-path="/shop/notify.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke-linejoin="round"/><path d="M13.7 21a2 2 0 01-3.4 0" stroke-linecap="round"/></svg>
          แจ้งเตือน
        </a>
        <a class="menu-item" href="#" data-path="#" id="viewShopLink" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/></svg>
          ดูร้าน
        </a>
        <div class="menu-divider"></div>
        <a class="menu-item" href="/settings/profile" data-path="/settings/profile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" stroke-linecap="round" stroke-linejoin="round"/></svg>
          ออกจากร้านค้า
        </a>
      </aside>
      <script>
        // เปิด/ปิดเมนูด้านซ้าย (มือถือ) + ไฮไลต์เมนูของหน้าที่เปิดอยู่
        (function () {
          var KEY = 'qpage_shop_menu';
          var btn = document.getElementById('menuToggle');
          function applyMenu(open) {
            document.body.classList.toggle('shop-menu-closed', !open);
            if (btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
          }
          var saved = null;
          try { saved = localStorage.getItem(KEY); } catch (e) { /* ข้าม */ }
          // ค่าเริ่มต้น: จอใหญ่เปิดเมนู จอมือถือซ่อนไว้ก่อน (จำค่าที่ผู้ใช้เลือกไว้ในเครื่อง)
          applyMenu(saved ? saved === 'open' : window.innerWidth > 900);
          if (btn) btn.addEventListener('click', function () {
            var open = document.body.classList.contains('shop-menu-closed');
            applyMenu(open);
            try { localStorage.setItem(KEY, open ? 'open' : 'closed'); } catch (e) { /* ข้าม */ }
          });
          var here = location.pathname.replace(/\/+$/, '');
          document.querySelectorAll('.shop-side .menu-item[data-path]').forEach(function (a) {
            if (a.dataset.path === here) a.classList.add('active');
          });
          // ลิงก์ "ดูร้าน" — ดึงรหัสร้านของตัวเอง
          fetch('/api/shop/me').then(function (r) { return r.json(); }).then(function (d) {
            if (d && d.shop && d.shop.public_code) document.getElementById('viewShopLink').href = '/s/' + d.shop.public_code;
          }).catch(function () { /* ข้าม */ });
        })();
      </script>

      <div class="shop-wrap">
    <div class="shop-head">
      <h1>ประวัติออเดอร์</h1>
      <p>ดูย้อนหลังว่าบิลที่ปิดไปแล้วแต่ละโต๊ะมีอะไรบ้าง — กดที่บิลเพื่อดูรายละเอียดเป็นชุด ๆ</p>
    </div>

    <div class="hist-filter">
      <label for="fTable">โต๊ะ</label>
      <select class="mini-input" id="fTable"><option value="">ทุกโต๊ะ</option></select>
      <label for="fLimit">จำนวนบิลล่าสุด</label>
      <select class="mini-input" id="fLimit">
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="200">200</option>
      </select>
      <button class="mini-btn" id="exportBtn" type="button">ออกรายการล่าสุด (CSV)</button>
    </div>

    <div id="histList"></div>
  </div>
    </div>

  <div class="toast" id="toast"></div>

  <script>
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const money = (n) => '฿' + Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    const billNoFmt = (n) => (n ? '#' + String(n).padStart(4, '0') : '—');
    let toastTimer = null;
    let lastOrders = [];

    async function api(path, opts) {
      const res = await fetch(path, opts);
      let data; try { data = await res.json(); } catch { const e = new Error('HTTP ' + res.status); e.status = res.status; throw e; }
      if (!data.ok) { const e = new Error(data.message || 'เกิดข้อผิดพลาด'); e.status = res.status; throw e; }
      return data;
    }
    function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2500); }
    const dt = (iso) => { if (!iso) return '—'; const d = new Date(iso); if (isNaN(d)) return iso; const p = (n) => String(n).padStart(2, '0'); return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); };

    async function loadTables() {
      try {
        const data = await api('/api/shop/tables');
        const sel = document.getElementById('fTable');
        const cur = sel.value;
        sel.innerHTML = '<option value="">ทุกโต๊ะ</option>' + (data.tables || []).map((t) => `<option value="${t.id}">โต๊ะ ${esc(t.code)}</option>`).join('');
        if (cur) sel.value = cur;
      } catch (e) { /* ignore */ }
    }

    async function loadHistory() {
      const tableId = document.getElementById('fTable').value;
      const limit = document.getElementById('fLimit').value;
      const qs = new URLSearchParams();
      if (tableId) qs.set('tableId', tableId);
      if (limit) qs.set('limit', limit);
      const data = await api('/api/shop/orders/history' + (qs.toString() ? '?' + qs.toString() : ''));
      lastOrders = data.orders || [];
      const box = document.getElementById('histList');
      if (!lastOrders.length) { box.innerHTML = '<div class="cat-empty">ยังไม่มีประวัติ (ยังไม่มีการเช็คบิล)</div>'; return; }
      box.innerHTML = lastOrders.map((o) => `
        <details class="bill-card">
          <summary>
            <div style="flex:1;min-width:0;">
              <div class="table-code">บิล ${billNoFmt(o.bill_no)} · โต๊ะ ${esc(o.table_code)}</div>
              <div class="hist-sub">เปิด ${dt(o.opened_at)} · ปิด ${dt(o.closed_at)} · ${o.item_count} รายการ</div>
            </div>
            <div class="bill-total">${money(o.total)}</div>
          </summary>
          <div class="hist-items">
            ${o.items.length ? o.items.map((it) => {
              let opts = []; try { opts = it.options_json ? JSON.parse(it.options_json) : []; } catch (e) {}
              const cancelled = it.status === 'cancelled';
              return `<div class="bill-item"${cancelled ? ' style="opacity:.6;"' : ''}>
                <span>${it.quantity} × ${cancelled ? '<span style="text-decoration:line-through;">' + esc(it.menu_name) + '</span>' : esc(it.menu_name)}${opts.length ? ' <small>(' + esc(opts.join(', ')) + ')</small>' : ''}${cancelled ? ' <span class="st-badge st-cancelled">ยกเลิก' + (it.cancel_reason ? ': ' + esc(it.cancel_reason) : '') + '</span>' : ''}</span>
                <span>${cancelled ? '—' : money(it.line_total)}</span>
              </div>`;
            }).join('') : '<div style="color:var(--muted);font-size:13px;">ไม่มีรายการ</div>'}
          </div>
          <div class="hist-actions">
            <a class="mini-btn primary" href="/shop/receipt.html?order=${o.id}" target="_blank" rel="noopener">🖨 ขอใบเสร็จ (พิมพ์ใหม่)</a>
          </div>
        </details>`).join('');
    }

    document.getElementById('fTable').addEventListener('change', () => loadHistory().catch((e) => alert(e.message)));
    document.getElementById('fLimit').addEventListener('change', () => loadHistory().catch((e) => alert(e.message)));

    document.getElementById('exportBtn').addEventListener('click', () => {
      if (!lastOrders.length) { toast('ไม่มีข้อมูลให้ออก'); return; }
      const rows = [['บิล', 'โต๊ะ', 'เปิด', 'ปิด', 'จำนวน', 'ยอดรวม', 'รายการ']];
      lastOrders.forEach((o) => {
        const names = o.items.map((it) => `${it.quantity}x ${it.menu_name}${(it.status === 'cancelled') ? '(ยกเลิก)' : ''}`).join(' | ');
        rows.push([billNoFmt(o.bill_no), o.table_code, o.opened_at || '', o.closed_at || '', o.item_count, Number(o.total), names]);
      });
      const csv = '\ufeff' + rows.map((r) => r.map((c) => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'order-history.csv';
      a.click();
      URL.revokeObjectURL(a.href);
    });

    (async () => {
      try {
        const me = await api('/api/shop/me');
        if (!me.shop) { window.location.href = '/shop/setup.html'; return; }
        document.getElementById('shopName').textContent = me.shop.name || 'ร้านของฉัน';
        await loadTables();
        await loadHistory();
      } catch (e) {
        if (e.status === 403) { window.location.href = '/shop'; return; }
        document.getElementById('histList').innerHTML = '<div class="cat-empty">' + esc(e.message) + '</div>';
      }
    })();
  </script>
</body>
</html>
