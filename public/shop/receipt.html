<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ใบเสร็จรับเงิน | ระบบสมาชิก</title>
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px 12px 40px;
      font-family: 'Sarabun', 'Noto Sans Thai', Tahoma, Arial, sans-serif;
      color: #111; background: #eff0f5; line-height: 1.5; font-size: 12px;
    }
    /* แถบปุ่ม (ไม่พิมพ์) */
    .actions { max-width: 720px; margin: 0 auto 12px; display: flex; gap: 8px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
    .actions .paper-pick { margin-right: auto; font-size: 13px; color: #475467; display: flex; align-items: center; gap: 6px; }
    .actions select { font-family: inherit; font-size: 13px; padding: 7px 9px; border-radius: 8px; border: 1px solid #c9cdd6; background: #fff; color: #111; }
    .actions button {
      font-family: inherit; font-size: 13.5px; font-weight: 700; padding: 9px 15px;
      border-radius: 9px; border: 1px solid #c9cdd6; background: #fff; color: #111; cursor: pointer;
    }
    .actions button.primary { background: #4f46e5; border-color: #4f46e5; color: #fff; }

    /* ---------- ใบเสร็จ (ค่าเริ่มต้น = ม้วน 80mm) ---------- */
    .receipt {
      max-width: 80mm; margin: 0 auto; background: #fff;
      box-shadow: 0 8px 24px rgba(16,24,40,.10); padding: 14px 12px 12px;
    }
    .r-shop-logo { text-align: center; margin-bottom: 6px; }
    .r-shop-logo img { max-height: 74px; max-width: 62%; height: auto; object-fit: contain; }
    .r-shop { text-align: center; font-size: 15px; font-weight: 800; line-height: 1.35; }
    .r-shop-sub { text-align: center; font-size: 11px; color: #667085; margin-top: 2px; }
    .r-title {
      text-align: center; font-size: 13px; font-weight: 700; letter-spacing: .4px;
      margin: 10px 0 9px; padding-top: 9px; border-top: 1px dashed #d0d5dd;
    }
    .r-meta { display: grid; grid-template-columns: 1fr; gap: 2px; font-size: 11.5px; margin-bottom: 10px; }
    .r-meta > div { display: flex; justify-content: space-between; gap: 10px; }
    .r-meta span { color: #667085; }
    .r-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
    .r-table th {
      text-align: left; font-size: 10.5px; color: #667085; font-weight: 700;
      padding: 4px 2px; border-bottom: 1px solid #111;
    }
    .r-table td { padding: 4px 2px; border-bottom: 1px dotted #e4e7ec; vertical-align: top; }
    .r-table .num { text-align: right; white-space: nowrap; }
    .r-table .r-item-name { font-weight: 700; }
    .r-table .r-item-opt { font-size: 10.5px; color: #667085; margin-top: 1px; }
    .r-total-label { text-align: right; font-weight: 700; padding-top: 7px !important; border: none !important; }
    .r-total { font-size: 15px; font-weight: 800; padding-top: 7px !important; border: none !important; }
    .r-split { display: flex; justify-content: space-between; font-size: 11.5px; padding: 2px 2px 0; }
    .r-note { font-size: 10.5px; color: #b45309; margin: 8px 0 0; }
    .r-thanks { text-align: center; font-size: 12.5px; font-weight: 700; margin: 12px 0 5px; }
    /* บรรทัดเครดิต + โลโก้ QPage ย่อเล็ก อยู่บรรทัดเดียวกัน */
    .r-foot {
      display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: nowrap;
      font-size: 10px; color: #98a2b3; margin: 0;
    }
    .r-foot img { height: 16px; width: auto; opacity: .9; flex-shrink: 0; }
    .r-loading { text-align: center; color: #667085; padding: 30px 0; }

    /* ---------- กระดาษม้วน 58mm (แคบสุด) ---------- */
    body.paper-58mm { font-size: 11px; }
    body.paper-58mm .receipt { max-width: 58mm; padding: 12px 8px 10px; }
    body.paper-58mm .r-table { font-size: 10.5px; }
    body.paper-58mm .r-shop { font-size: 14px; }
    body.paper-58mm .r-total { font-size: 14px; }
    body.paper-58mm .r-foot img { height: 14px; }
    /* ---------- กระดาษ A4 ---------- */
    body.paper-a4 { font-size: 14px; }
    body.paper-a4 .receipt { max-width: 720px; padding: 34px 38px 26px; border-radius: 14px; }
    body.paper-a4 .r-table { font-size: 14px; }
    body.paper-a4 .r-meta { grid-template-columns: 1fr 1fr; gap: 6px 18px; font-size: 14px; }
    body.paper-a4 .r-title { font-size: 16px; margin: 18px 0 16px; padding-top: 16px; }
    body.paper-a4 .r-shop { font-size: 19px; }
    body.paper-a4 .r-shop-logo img { max-height: 96px; }
    body.paper-a4 .r-total { font-size: 19px; }
    body.paper-a4 .r-thanks { font-size: 14.5px; }
    body.paper-a4 .r-foot { font-size: 11.5px; }
    body.paper-a4 .r-foot img { height: 18px; }

    @media print {
      body { background: #fff; padding: 0; }
      .actions { display: none !important; }
      .receipt { box-shadow: none; border-radius: 0; max-width: none; padding: 0; }
      .r-table th { border-bottom-color: #000; }
    }
  </style>
</head>
<body class="paper-80mm">
  <div class="actions">
    <label class="paper-pick">ขนาดกระดาษ
      <select id="paperSel">
        <option value="58mm">ม้วน 58mm</option>
        <option value="80mm" selected>ม้วน 80mm (ค่าเริ่มต้น)</option>
        <option value="a4">A4</option>
      </select>
    </label>
    <button class="primary" id="printBtn" type="button">🖨 พิมพ์ใบเสร็จ</button>
    <button id="closeBtn" type="button">ปิดหน้านี้</button>
  </div>
  <div class="receipt" id="receipt">
    <div class="r-loading" id="loading">กำลังโหลดใบเสร็จ...</div>
  </div>

  <script>
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const money = (n) => '฿' + Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    const billNoFmt = (n) => (n ? '#' + String(n).padStart(4, '0') : '—');
    const orderId = (new URLSearchParams(location.search).get('order') || '').trim();

    function fmtDateTime(v) {
      if (!v) return '—';
      const d = new Date(v);
      if (isNaN(d.getTime())) return '—';
      const p = (n) => String(n).padStart(2, '0');
      return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    }

    async function api(path) {
      const res = await fetch(path);
      let data; try { data = await res.json(); } catch { throw new Error('เซิร์ฟเวอร์ตอบสนองไม่ถูกต้อง (HTTP ' + res.status + ')'); }
      if (!data.ok) { const e = new Error(data.message || 'โหลดข้อมูลไม่สำเร็จ'); e.status = res.status; throw e; }
      return data;
    }

    function render(shop, order, items) {
      const shown = items.filter((i) => (i.status || '') !== 'cancelled');
      // นับ "รายการ" เป็นจำนวนจาน (ผลรวม quantity) ให้ตรงกับแจ้งเตือนและหน้าจออื่น
      const cancelledQty = items.filter((i) => (i.status || '') === 'cancelled').reduce((s, i) => s + Number(i.quantity || 0), 0);
      const rows = shown.map((it, idx) => {
        let opts = []; try { opts = it.options_json ? JSON.parse(it.options_json) : []; } catch (e) {}
        const sub = (opts.length ? esc(opts.join(', ')) + ' · ' : '') + money(it.unit_price) + '/หน่วย';
        return `<tr>
          <td class="num">${idx + 1}</td>
          <td><div class="r-item-name">${esc(it.menu_name)}</div><div class="r-item-opt">${sub}</div></td>
          <td class="num">${it.quantity}</td>
          <td class="num">${money(it.line_total)}</td>
        </tr>`;
      }).join('');
      const qtyTotal = shown.reduce((s, i) => s + Number(i.quantity || 0), 0);

      document.getElementById('receipt').innerHTML = `
        ${shop.logo_url ? '<div class="r-shop-logo"><img src="' + esc(shop.logo_url) + '" alt="' + esc(shop.name || '') + '"></div>' : ''}
        <div class="r-shop">${esc(shop.name || '')}</div>
        <div class="r-shop-sub">${[shop.phone, shop.address].filter(Boolean).map(esc).join(' · ') || '&nbsp;'}</div>
        <div class="r-title">ใบเสร็จรับเงิน</div>
        <div class="r-meta">
          <div><span>โต๊ะ</span><strong>${esc(order.table_code || '—')}</strong></div>
          <div><span>เลขที่บิล</span><strong>${billNoFmt(order.bill_no)}</strong></div>
          <div><span>วันที่</span><strong>${fmtDateTime(order.closed_at || order.created_at)}</strong></div>
          <div><span>รายการ</span><strong>${qtyTotal} รายการ · ${shown.length} เมนู</strong></div>
        </div>
        <table class="r-table">
          <thead><tr><th>#</th><th>รายการ</th><th class="num">จำนวน</th><th class="num">รวม</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="4" style="text-align:center;color:#667085;">ไม่มีรายการ</td></tr>'}</tbody>
          <tfoot><tr><td colspan="3" class="r-total-label">ยอดรวมทั้งสิ้น</td><td class="num r-total">${money(order.total)}</td></tr></tfoot>
        </table>
        ${cancelledQty ? '<p class="r-note">หมายเหตุ: มี ' + cancelledQty + ' รายการที่ถูกยกเลิก (ไม่คิดเงิน)</p>' : ''}
        <p class="r-thanks">ขอบคุณที่ใช้บริการ</p>
        <p class="r-foot">พิมพ์โดยระบบ QPage · qpage.website <img src="/img/logo-wordmark.svg" alt="QPage"></p>`;
    }

    function renderError(message, hint) {
      // ไม่มีใบเสร็จให้พิมพ์ — ซ่อนปุ่มพิมพ์ และให้ทางออกที่ชัดเจน (กันหน้าค้างอยู่)
      const pb = document.getElementById('printBtn');
      if (pb) pb.style.display = 'none';
      const detail = hint || 'บิลนี้อาจถูกลบไปก่อนที่ระบบจะเริ่มเก็บประวัติการเช็คบิล<br>ตอนนี้บิลที่เช็คบิลแล้วจะไม่ถูกลบอีก — ดูย้อนหลังได้ที่หน้า “ประวัติ”';
      document.getElementById('receipt').innerHTML = `
        <div class="r-loading" style="padding:26px 14px;line-height:1.7;">
          <div style="font-size:15px;font-weight:700;color:#111;margin-bottom:8px;">${esc(message)}</div>
          <div style="font-size:13px;color:#475467;">${detail}</div>
          <div style="margin-top:16px;">
            <a href="/shop/history.html" style="display:inline-block;padding:9px 16px;border-radius:9px;background:#4f46e5;color:#fff;text-decoration:none;font-weight:700;font-size:13.5px;">ไปหน้าประวัติ</a>
          </div>
        </div>`;
    }

    // ---------- เลือกขนาดกระดาษ (ม้วน 58/80mm หรือ A4) — จำค่าไว้ในเครื่อง ----------
    const PAPER_KEY = 'qpage_receipt_paper';
    function applyPaper(mm) {
      const size = mm === 'a4' ? 'A4' : mm + ' auto';
      const margin = mm === 'a4' ? '12mm' : '3mm';
      let st = document.getElementById('paperStyle');
      if (!st) { st = document.createElement('style'); st.id = 'paperStyle'; document.head.appendChild(st); }
      st.textContent = '@page { size: ' + size + '; margin: ' + margin + '; }';
      document.body.className = 'paper-' + mm;
    }
    const paperSel = document.getElementById('paperSel');
    try { const saved = localStorage.getItem(PAPER_KEY); if (saved) paperSel.value = saved; } catch (e) { /* ข้าม */ }
    applyPaper(paperSel.value);
    paperSel.addEventListener('change', () => {
      try { localStorage.setItem(PAPER_KEY, paperSel.value); } catch (e) { /* ข้าม */ }
      applyPaper(paperSel.value);
    });

    document.getElementById('printBtn').addEventListener('click', () => window.print());
    // ปิดหน้านี้ให้ได้จริงทุกกรณี: ถ้าเบราว์เซอร์ไม่ยอมให้ปิด (เช่น แท็บที่เปิดด้วยลิงก์) ให้พาออกไปหน้าประวัติแทน
    function closeSelf() {
      try { window.close(); } catch (e) { /* ข้าม */ }
      setTimeout(() => { if (!window.closed) location.replace('/shop/history.html'); }, 350);
    }
    document.getElementById('closeBtn').addEventListener('click', closeSelf);

    (async function init() {
      if (!orderId || !/^\d+$/.test(orderId)) {
        renderError('ไม่พบเลขที่บิลที่ต้องการพิมพ์', 'หน้านี้ต้องเปิดจากปุ่ม “เช็คบิล” หรือปุ่ม “ขอใบเสร็จ (พิมพ์ใหม่)” ในหน้าประวัติ');
        return;
      }
      try {
        const [me, data] = await Promise.all([api('/api/shop/me'), api('/api/shop/orders/' + orderId)]);
        render(me.shop || {}, data.order || {}, data.items || []);
        // เปิดหน้าต่างพิมพ์ให้อัตโนมัติหลังเรนเดอร์เสร็จ
        setTimeout(() => { try { window.print(); } catch (e) { /* ผู้ใช้อาจปิดการพิมพ์ */ } }, 500);
      } catch (err) {
        if (err && err.status === 403) renderError('กรุณาเข้าสู่ระบบก่อนเปิดใบเสร็จ', 'ล็อกอินเข้าระบบแล้วเปิดหน้านี้อีกครั้ง');
        else renderError(err.message || 'โหลดใบเสร็จไม่สำเร็จ');
      }
    })();
  </script>
</body>
</html>
