      <script>
        // เปิด/ปิดเมนูด้านซ้าย (มือถือ) + ไฮไลต์เมนูของหน้าที่เปิดอยู่
        (function () {
          var KEY = 'qpage_shop_menu';
          var btn = document.getElementById('menuToggle');
          function applyMenu(open) {
            document.body.classList.toggle('side-menu-closed', !open);
            if (btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
          }
          function saveMenu(open) { try { localStorage.setItem(KEY, open ? 'open' : 'closed'); } catch (e) { /* ข้าม */ } }
          var saved = null;
          try { saved = localStorage.getItem(KEY); } catch (e) { /* ข้าม */ }
          // ค่าเริ่มต้น: จอใหญ่เปิดเมนู จอมือถือซ่อนไว้ก่อน (จำค่าที่ผู้ใช้เลือกไว้ในเครื่อง)
          applyMenu(saved ? saved === 'open' : window.innerWidth > 900);
          if (btn) btn.addEventListener('click', function () { var open = document.body.classList.contains('side-menu-closed'); applyMenu(open); saveMenu(open); });
          // ความสูงจริงของแถบหัว → ใช้เป็นจุดเริ่มของแผงเมนูด้านซ้าย
          function syncNavHeight() {
            var nav = document.querySelector('.site-nav');
            if (nav) document.documentElement.style.setProperty('--nav-h', Math.round(nav.getBoundingClientRect().height) + 'px');
          }
          syncNavHeight();
          window.addEventListener('resize', syncNavHeight);
          // ฉากมืดหลังเมนู — แตะแล้วปิดเมนู
          var back = document.createElement('div');
          back.className = 'side-menu-backdrop';
          document.body.appendChild(back);
          back.addEventListener('click', function () { applyMenu(false); saveMenu(false); });
          // ปิดเมนูด้วยปุ่ม Esc
          document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { applyMenu(false); saveMenu(false); } });
          var here = location.pathname.replace(/\/+$/, '');
          document.querySelectorAll('.shop-side .menu-item[data-path]').forEach(function (a) {
            if (a.dataset.path === here) a.classList.add('active');
          });
          // ลิงก์ "ดูร้าน" — ดึงรหัสร้านของตัวเอง
          fetch('/api/shop/me').then(function (r) { return r.json(); }).then(function (d) {
            if (d && d.shop && d.shop.public_code) document.getElementById('viewShopLink').href = '/s/' + d.shop.public_code;
          }).catch(function () { /* ข้าม */ });
        })();
      </script>

      <div class="shop-wrap">
        <div class="shop-head">
          <h1>ตั้งค่าระบบ</h1>
          <p>ตั้งค่าการทำงานของระบบร้าน — ตัวเลือกด้านล่างมีผลทันทีทั้งร้าน</p>
        </div>

        <div class="set-card">
          <div class="set-row">
            <label class="switch" title="เปิด = เช็คบิลแล้วปิดใช้งาน QR ของโต๊ะนั้นทันที">
              <input type="checkbox" id="autoDeleteQr">
              <span class="track"></span>
            </label>
            <div style="flex:1;min-width:0;">
              <div class="set-title">ปิดใช้งาน QR ของโต๊ะทันทีเมื่อเช็คบิล <span class="set-state off" id="setState">ปิดอยู่</span></div>
              <div class="set-sub" id="autoDeleteHint">กำลังโหลด...</div>
            </div>
          </div>
          <div class="set-sub" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
            เปิดไว้: เมื่อกดเช็คบิล โต๊ะนั้นจะถูก <strong>ปิดใช้งาน QR ทันที</strong> (สแกนไม่ได้อีก และใช้ซ้ำไม่ได้) และต้องสร้าง QR ใหม่ก่อนให้ลูกค้าสั่งครั้งถัดไป<br>
            ปิดไว้: เช็คบิลแล้วโต๊ะและ QR ยังใช้งานต่อ และระบบเปิดบิลใหม่ให้อัตโนมัติ<br>
            ไม่ว่าจะเปิดหรือปิด <strong>QR และโต๊ะที่ปิดใช้งานแล้วจะไม่ถูกลบ</strong> — ดูย้อนหลังได้ที่หน้า <a href="/shop/history.html">ประวัติ</a> (แท็บ “QR โต๊ะที่ปิดใช้งาน”)
          </div>
          <div class="error-msg" id="setErr" style="display:none;"></div>
        </div>
      </div>

  <div class="toast" id="toast"></div>

  <script>
    let enabled = false;
    let toastTimer = null;

    function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3000); }

    async function api(path, opts) {
      const res = await fetch(path, opts);
      let data; try { data = await res.json(); } catch { const e = new Error('HTTP ' + res.status); e.status = res.status; throw e; }
      if (!data.ok) { const e = new Error(data.message || 'เกิดข้อผิดพลาด'); e.status = res.status; throw e; }
      return data;
    }
    function showErr(msg) { const el = document.getElementById('setErr'); el.textContent = msg || ''; el.style.display = msg ? 'block' : 'none'; }
    function paint() {
      const el = document.getElementById('autoDeleteQr');
      if (el) el.checked = enabled;
      const st = document.getElementById('setState');
      st.textContent = enabled ? 'เปิดอยู่' : 'ปิดอยู่';
      st.className = 'set-state ' + (enabled ? 'on' : 'off');
      document.getElementById('autoDeleteHint').textContent = enabled
        ? 'เปิดอยู่ — เช็คบิลแล้ว QR ของโต๊ะนั้นจะถูกปิดใช้งานทันที (ต้องสร้าง QR ใหม่ก่อนให้ลูกค้าสั่งครั้งถัดไป) โดยโต๊ะและ QR เดิมยังดูย้อนหลังได้ในหน้า “ประวัติ”'
        : 'ปิดอยู่ — เช็คบิลแล้วโต๊ะและ QR ยังใช้งานต่อ และเปิดบิลใหม่ให้อัตโนมัติ';
    }

    document.getElementById('autoDeleteQr').addEventListener('change', async (e) => {
      const el = e.currentTarget;
      const on = el.checked;
      // กันเผลอกดโดน: ต้องยืนยันก่อนทุกครั้ง (กดยกเลิก = คืนค่าเดิม ไม่บันทึก)
      const ask = on
        ? 'ยืนยันเปิด “ปิดใช้งาน QR ของโต๊ะทันทีเมื่อเช็คบิล” ?\n\nเมื่อกดเช็คบิล QR ของโต๊ะนั้นจะถูกปิดใช้งานทันที (สแกนไม่ได้อีก) และต้องสร้าง QR ใหม่ก่อนให้ลูกค้าสั่งครั้งถัดไป — ตัว QR และประวัติยังดูย้อนหลังได้ในหน้า "ประวัติ"'
        : 'ยืนยันปิด “ปิดใช้งาน QR ของโต๊ะทันทีเมื่อเช็คบิล” ?\n\nเมื่อกดเช็คบิล โต๊ะและ QR จะยังใช้งานต่อ และระบบจะเปิดบิลใหม่ให้อัตโนมัติ';
      if (!confirm(ask)) { el.checked = !on; return; }
      el.disabled = true;
      showErr('');
      try {
        const r = await api('/api/shop/qr-auto-delete', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ enabled: on }) });
        enabled = !!r.enabled;
        paint();
        toast(r.message || 'บันทึกแล้ว');
      } catch (err) {
        el.checked = !on;
        showErr(err.message);
      } finally { el.disabled = false; }
    });

    (async () => {
      try {
        const me = await api('/api/shop/me');
        if (!me.shop) { location.href = '/shop/setup.html'; return; }
        document.getElementById('shopName').textContent = me.shop.name || 'ร้านของฉัน';
        enabled = Number(me.shop.delete_qr_on_checkout) === 1;
        paint();
      } catch (e) {
        if (e.status === 403) { location.href = '/shop'; return; }
        showErr(e.message);
      }
    })();
  </script>
