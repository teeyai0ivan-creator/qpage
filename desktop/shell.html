<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>QPage Shop</title>
  <style>
    /* แถบด้านซ้ายของโปรแกรม (แสดงหลังเข้าสู่ระบบแล้วเท่านั้น) */
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100vh; overflow: hidden; }
    body {
      font-family: 'Sarabun', 'Noto Sans Thai', Tahoma, sans-serif;
      background: linear-gradient(180deg, #141c31 0%, #0f1626 100%);
      color: #e6e9f2; font-size: 13px;
      display: flex; flex-direction: column; padding: 12px 10px 10px;
      user-select: none; -webkit-app-region: drag;
    }
    button, .pill { -webkit-app-region: no-drag; }
    .top { display: flex; align-items: center; gap: 9px; padding: 2px 4px 12px; }
    .top img { width: 30px; height: 30px; border-radius: 9px; flex: none; }
    .top .who { min-width: 0; flex: 1; }
    .top b { display: block; font-size: 14px; letter-spacing: .2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .top small { display: block; font-size: 10.5px; color: #93a0bd; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .collapse { font-family: inherit; font-size: 14px; color: #aab3c8; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); border-radius: 8px; width: 26px; height: 26px; cursor: pointer; flex: none; padding: 0; }
    .collapse:hover { background: rgba(255,255,255,.14); color: #fff; }

    .label { font-size: 10.5px; font-weight: 800; color: #7c879f; letter-spacing: .6px; padding: 6px 6px 6px; }
    .nav { display: flex; flex-direction: column; gap: 5px; overflow-y: auto; flex: 1; min-height: 0; padding-right: 2px; }
    .nav button {
      font-family: inherit; font-size: 13.5px; font-weight: 700; color: #cfd6e6; text-align: left;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08);
      padding: 11px 12px; border-radius: 11px; cursor: pointer; white-space: nowrap;
      display: flex; align-items: center; gap: 10px;
    }
    .nav button svg { width: 17px; height: 17px; flex: none; }
    .nav button:hover { background: rgba(255,255,255,.12); color: #fff; }
    .nav button.active { background: linear-gradient(135deg, #6366f1, #8b5cf6); border-color: transparent; color: #fff; box-shadow: 0 6px 14px rgba(99,102,241,.3); }
    .nav .cnt { margin-left: auto; background: #ef4444; color: #fff; font-size: 10.5px; font-weight: 800; border-radius: 999px; padding: 1px 7px; }

    .status { display: flex; flex-direction: column; gap: 5px; padding: 10px 2px 8px; border-top: 1px solid rgba(255,255,255,.09); margin-top: 8px; }
    .pill { display: flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 700; padding: 6px 9px; border-radius: 9px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); color: #c7cee0; }
    .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: #94a3b8; flex: none; }
    .pill.ok .dot { background: #34d399; } .pill.ok { color: #a7f3d0; }
    .pill.warn .dot { background: #fbbf24; } .pill.warn { color: #fde68a; }
    .pill.bad .dot { background: #f87171; } .pill.bad { color: #fecaca; }
    .pill span.txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 0 2px; }
    .tools button {
      font-family: inherit; font-size: 16px; color: #cfd6e6; background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08); height: 34px; border-radius: 10px; cursor: pointer; padding: 0;
    }
    .tools button:hover { background: rgba(255,255,255,.14); color: #fff; }
    .tools button.wide { grid-column: span 3; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 7px; }
    .clock { text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; color: #93a0bd; font-size: 12px; padding: 8px 0 2px; }

    /* โหมดย่อ: เหลือแค่ไอคอน (กดปุ่มมุมขวาบนเพื่อสลับ) */
    body.mini .top .who, body.mini .label, body.mini .nav button span.t, body.mini .pill span.txt, body.mini .clock { display: none; }
    body.mini .nav button { justify-content: center; padding: 11px 0; }
    body.mini .top { justify-content: center; }
    body.mini .tools { grid-template-columns: repeat(2, 1fr); }
    body.mini .tools button.wide { grid-column: span 2; }
  </style>
</head>
<body>
  <div class="top">
    <img src="icon-256.png" alt="" onerror="this.style.display='none'">
    <div class="who"><b id="brandName">QPage Shop</b><small id="brandSub">โปรแกรมร้านค้า</small></div>
    <button class="collapse" id="btnCollapse" type="button" title="ย่อ/ขยายแถบเมนู">☰</button>
  </div>

  <div class="label">หน้าการใช้งาน</div>
  <nav class="nav">
    <button type="button" data-nav="/shop/kitchen.html" data-match="/shop/kitchen.html" title="ครัว">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M4 10h16v6a4 4 0 01-4 4H8a4 4 0 01-4-4v-6z"/><path d="M6 10V7a2 2 0 012-2h8a2 2 0 012 2v3"/></svg>
      <span class="t">ครัว</span>
    </button>
    <button type="button" data-nav="/shop/cashier.html" data-match="/shop/cashier.html" title="แคชเชียร์">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 11h.01M12 11h.01M15 11h.01M9 15h.01M12 15h.01M15 15h.01" stroke-linecap="round"/></svg>
      <span class="t">แคชเชียร์</span>
    </button>
    <button type="button" data-nav="/shop/orders.html" data-match="/shop/orders.html" title="สั่งอาหาร">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      <span class="t">สั่งอาหาร</span>
    </button>
    <button type="button" data-nav="/shop/history.html" data-match="/shop/history.html" title="ประวัติ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1015.5-6.2M3 4v4h4"/><path d="M12 8v4l3 2"/></svg>
      <span class="t">ประวัติ</span>
    </button>
    <button type="button" data-nav="/shop/kitchen-history.html" data-match="/shop/kitchen-history.html" title="ประวัติสั่งครัว">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M6 9V3h12v6a4 4 0 01-4 4h-4a4 4 0 01-4-4z"/><path d="M6 5H4v3a3 3 0 003 3M18 5h2v3a3 3 0 01-3 3M9 17h6M12 13v4M8 21h8"/></svg>
      <span class="t">ประวัติสั่งครัว</span>
    </button>
    <button type="button" data-nav="/shop/menu.html" data-match="/shop/menu.html" title="จัดการเมนู">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M4 5a2 2 0 012-2h12v18H6a2 2 0 01-2-2V5z"/><path d="M8 7h8M8 11h5"/></svg>
      <span class="t">จัดการเมนู</span>
    </button>
    <button type="button" data-nav="/shop/menus.html" data-match="/shop/menus.html" title="เมนูทั้งหมด">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10M15 10v10"/></svg>
      <span class="t">เมนูทั้งหมด</span>
    </button>
    <button type="button" data-nav="/shop/setup.html" data-match="/shop/setup.html" title="ตั้งค่าข้อมูลร้าน">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4H6z"/><path d="M3 6h18M16 10a4 4 0 01-8 0"/></svg>
      <span class="t">ตั้งค่าข้อมูลร้าน</span>
    </button>
    <button type="button" data-nav="/shop/notify.html" data-match="/shop/notify.html" title="แจ้งเตือน">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
      <span class="t">แจ้งเตือน</span>
    </button>
    <button type="button" data-nav="/shop/settings.html" data-match="/shop/settings.html" title="ตั้งค่าระบบ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.5 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
      <span class="t">ตั้งค่าระบบ</span>
    </button>
  </nav>

  <div class="status">
    <span class="pill" id="pillShop"><span class="dot"></span><span class="txt" id="txtShop">—</span></span>
    <span class="pill" id="pillPrinter"><span class="dot"></span><span class="txt" id="txtPrinter">—</span></span>
    <span class="pill" id="pillJobs"><span class="dot"></span><span class="txt" id="txtJobs">—</span></span>
  </div>

  <div class="tools">
    <button id="btnPrintTest" type="button" title="พิมพ์ใบสั่งครัวทดสอบ">🖨</button>
    <button id="btnTheme" type="button" title="สลับธีมสว่าง/มืด">🌗</button>
    <button id="btnReload" type="button" title="รีเฟรชหน้าจอ (F5)">⟳</button>
    <button id="btnZoomOut" type="button" title="ย่อขนาด">−</button>
    <button id="btnZoomIn" type="button" title="ขยายขนาด">＋</button>
    <button id="btnFull" type="button" title="เต็มจอ (F11)">⛶</button>
    <button id="btnSettings" class="wide" type="button" title="ตั้งค่าเครื่องพิมพ์/โปรแกรม">⚙ ตั้งค่าโปรแกรม</button>
    <button id="btnLogout" class="wide" type="button" title="ออกจากระบบ">ออกจากระบบ</button>
  </div>

  <div class="clock" id="clock">--:--</div>

  <script src="shell.js"></script>
</body>
</html>
